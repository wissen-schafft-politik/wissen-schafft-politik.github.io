name: Datenbank validieren

# Prüft data/experts.json bei jedem Push/PR gegen das JSON-Schema.

on:
  push:
    branches: [main]
    paths: ['data/**']
  pull_request:
    paths: ['data/**']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet jsonschema
      - run: python scripts/validate.py
